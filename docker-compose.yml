# Nom de projet Compose fixe : toute commande `docker compose` (start.sh, scripts,
# commandes des fiches TP, interface 8083) cible le même projet, quel que soit
# le nom ou l'emplacement du dossier du dépôt.
name: simulpix

services:
  kafka-1:
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    container_name: kafka-1
    hostname: kafka-1
    labels:
      simulpix.group: middleware
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9094,2@kafka-2:9094,3@kafka-3:9095
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="broker" password="broker-secret" user_broker="broker-secret" user_simulpix="simulpix-secret";
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="broker" password="broker-secret" user_broker="broker-secret" user_simulpix="simulpix-secret";
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_JMX_PORT: 9991
      KAFKA_JMX_HOSTNAME: kafka-1
      KAFKA_JMX_OPTS: -Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=kafka-1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - ./infra/kafka/scripts:/scripts
      - ./infra/kafka/config:/config
      - kafka_1_data:/var/lib/kafka/data

  kafka-2:
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    container_name: kafka-2
    hostname: kafka-2
    labels:
      simulpix.group: middleware
    ports:
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9094,2@kafka-2:9094,3@kafka-3:9095
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="broker" password="broker-secret" user_broker="broker-secret" user_simulpix="simulpix-secret";
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="broker" password="broker-secret" user_broker="broker-secret" user_simulpix="simulpix-secret";
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_JMX_PORT: 9992
      KAFKA_JMX_HOSTNAME: kafka-2
      KAFKA_JMX_OPTS: -Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=kafka-2
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - ./infra/kafka/scripts:/scripts
      - ./infra/kafka/config:/config
      - kafka_2_data:/var/lib/kafka/data

  kafka-3:
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    container_name: kafka-3
    hostname: kafka-3
    labels:
      simulpix.group: middleware
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9095
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9094,2@kafka-2:9094,3@kafka-3:9095
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="broker" password="broker-secret" user_broker="broker-secret" user_simulpix="simulpix-secret";
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="broker" password="broker-secret" user_broker="broker-secret" user_simulpix="simulpix-secret";
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_JMX_PORT: 9993
      KAFKA_JMX_HOSTNAME: kafka-3
      KAFKA_JMX_OPTS: -Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=kafka-3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - ./infra/kafka/scripts:/scripts
      - ./infra/kafka/config:/config
      - kafka_3_data:/var/lib/kafka/data

  postgres:
    image: postgres:16@sha256:2586e2a95d1c9b31cb2967feb562948f7d364854453d703039b6efa45fe48417
    container_name: postgres
    labels:
      simulpix.group: persistance
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: simulpix
      POSTGRES_USER: simulpix
      POSTGRES_PASSWORD: simulpix
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d

  influxdb:
    image: influxdb:2.7@sha256:5355c90249dac331bbcd1fdf3c31c7782400cd0ec5225145fc50b9aa026e9342
    container_name: influxdb
    labels:
      simulpix.group: observabilite
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpass
      DOCKER_INFLUXDB_INIT_ORG: simulpix
      DOCKER_INFLUXDB_INIT_BUCKET: simulpix_observability
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: simulpix-observability-token
    volumes:
      - influxdb_data:/var/lib/influxdb2

  grafana:
    image: grafana/grafana:11.1.0@sha256:079600c9517b678c10cda6006b4487d3174512fd4c6cface37df7822756ed7a5
    container_name: grafana
    labels:
      simulpix.group: observabilite
    depends_on:
      - influxdb
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: adminpass
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  metrics-collector:
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    container_name: metrics-collector
    labels:
      simulpix.group: observabilite
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
      - influxdb
      - service-health
    environment:
      SIMULPIX_OBS_INTERVAL_SECONDS: 10
      SIMULPIX_INFLUXDB_URL: http://influxdb:8086
      SIMULPIX_INFLUXDB_ORG: simulpix
      SIMULPIX_INFLUXDB_BUCKET: simulpix_observability
      SIMULPIX_INFLUXDB_TOKEN: simulpix-observability-token
      SIMULPIX_SERVICE_HEALTH_URL: http://service-health:8082/health/details
      SIMULPIX_JMX_BROKERS: kafka-1:9991,kafka-2:9992,kafka-3:9993
      SIMULPIX_RUNTIME_DIR: /runtime/observability
    volumes:
      - ./infra/observability/scripts:/scripts:ro
      - ./runtime:/runtime
    entrypoint: ["/bin/sh", "/scripts/collect-metrics.sh"]

  topic-init:
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    container_name: topic-init
    labels:
      simulpix.group: middleware
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    volumes:
      - ./infra/kafka/scripts:/scripts
      - ./infra/kafka/config:/config
    entrypoint: ["/bin/sh", "/scripts/create-topics.sh"]

  generator:
    build:
      context: ./services/generator
    container_name: generator
    labels:
      simulpix.group: generation
    cap_add:
      - NET_ADMIN
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    environment:
      SIMULPIX_SERVICE_NAME: generator
      SIMULPIX_PROCESSING_ARCH: ${SIMULPIX_PROCESSING_ARCH:-split}
      SIMULPIX_GENERATOR_IDLE: ${SIMULPIX_GENERATOR_IDLE:-0}
      SIMULPIX_SCENARIO: ${SIMULPIX_SCENARIO:-nominal}
      SIMULPIX_RATE_PER_SECOND: ${SIMULPIX_RATE_PER_SECOND-10}
      SIMULPIX_TOTAL_MESSAGES: ${SIMULPIX_TOTAL_MESSAGES-100}
      SIMULPIX_TRAFFIC_MODEL: ${SIMULPIX_TRAFFIC_MODEL:-bursty}
      SIMULPIX_TRAFFIC_BUCKET_SECONDS: ${SIMULPIX_TRAFFIC_BUCKET_SECONDS:-1}
      SIMULPIX_TRAFFIC_TIME_COMPRESSION_FACTOR: ${SIMULPIX_TRAFFIC_TIME_COMPRESSION_FACTOR:-1}
      SIMULPIX_TRAFFIC_SECOND_AMPLITUDE: ${SIMULPIX_TRAFFIC_SECOND_AMPLITUDE:-0.18}
      SIMULPIX_TRAFFIC_MINUTE_AMPLITUDE: ${SIMULPIX_TRAFFIC_MINUTE_AMPLITUDE:-0.12}
      SIMULPIX_TRAFFIC_TEN_MINUTE_AMPLITUDE: ${SIMULPIX_TRAFFIC_TEN_MINUTE_AMPLITUDE:-0.08}
      SIMULPIX_TRAFFIC_HOUR_AMPLITUDE: ${SIMULPIX_TRAFFIC_HOUR_AMPLITUDE:-0.06}
      SIMULPIX_TRAFFIC_NOISE_AMPLITUDE: ${SIMULPIX_TRAFFIC_NOISE_AMPLITUDE:-0.08}
      SIMULPIX_TRAFFIC_BURST_PROBABILITY: ${SIMULPIX_TRAFFIC_BURST_PROBABILITY:-0.08}
      SIMULPIX_TRAFFIC_BURST_AMPLITUDE: ${SIMULPIX_TRAFFIC_BURST_AMPLITUDE:-1.8}
      SIMULPIX_TRAFFIC_BURST_DURATION_SECONDS: ${SIMULPIX_TRAFFIC_BURST_DURATION_SECONDS:-6}
      SIMULPIX_TRAFFIC_LULL_PROBABILITY: ${SIMULPIX_TRAFFIC_LULL_PROBABILITY:-0.05}
      SIMULPIX_TRAFFIC_LULL_AMPLITUDE: ${SIMULPIX_TRAFFIC_LULL_AMPLITUDE:-0.6}
      SIMULPIX_TRAFFIC_LULL_DURATION_SECONDS: ${SIMULPIX_TRAFFIC_LULL_DURATION_SECONDS:-10}
      SIMULPIX_TRAFFIC_SECOND_PERIOD_SECONDS: ${SIMULPIX_TRAFFIC_SECOND_PERIOD_SECONDS:-7}
      SIMULPIX_TRAFFIC_MINUTE_PERIOD_SECONDS: ${SIMULPIX_TRAFFIC_MINUTE_PERIOD_SECONDS:-75}
      SIMULPIX_TRAFFIC_TEN_MINUTE_PERIOD_SECONDS: ${SIMULPIX_TRAFFIC_TEN_MINUTE_PERIOD_SECONDS:-720}
      SIMULPIX_TRAFFIC_HOUR_PERIOD_SECONDS: ${SIMULPIX_TRAFFIC_HOUR_PERIOD_SECONDS:-3600}
      SIMULPIX_OPEN_LOOP_BATCH_SIZE: ${SIMULPIX_OPEN_LOOP_BATCH_SIZE:-500}
      SIMULPIX_OPEN_LOOP_PAUSE_SECONDS: ${SIMULPIX_OPEN_LOOP_PAUSE_SECONDS:-0.01}
      SIMULPIX_KAFKA_ACKS: ${SIMULPIX_KAFKA_ACKS:-all}
      SIMULPIX_KAFKA_RETRIES: ${SIMULPIX_KAFKA_RETRIES:-0}
      SIMULPIX_KAFKA_REQUEST_TIMEOUT_MS: ${SIMULPIX_KAFKA_REQUEST_TIMEOUT_MS:-}
      SIMULPIX_KAFKA_MESSAGE_TIMEOUT_MS: ${SIMULPIX_KAFKA_MESSAGE_TIMEOUT_MS:-}
      SIMULPIX_KAFKA_RETRY_BACKOFF_MS: ${SIMULPIX_KAFKA_RETRY_BACKOFF_MS:-}
      SIMULPIX_KAFKA_AMBIGUOUS_ACK_DUPLICATE_PERCENT: ${SIMULPIX_KAFKA_AMBIGUOUS_ACK_DUPLICATE_PERCENT:-0}
      SIMULPIX_KAFKA_PRODUCER_SEMANTICS: ${SIMULPIX_KAFKA_PRODUCER_SEMANTICS:-at_least_once}
      SIMULPIX_SEED: ${SIMULPIX_SEED:-42}
      SIMULPIX_MATCH_COUNT: ${SIMULPIX_MATCH_COUNT:-10}
      SIMULPIX_STADIUM_CAPACITY: ${SIMULPIX_STADIUM_CAPACITY:-44000}
      SIMULPIX_PIX_USAGE_RATE: ${SIMULPIX_PIX_USAGE_RATE:-0.05}
      SIMULPIX_PEAK_SHARE: ${SIMULPIX_PEAK_SHARE:-0.30}
      SIMULPIX_PEAK_WINDOW_MINUTES: ${SIMULPIX_PEAK_WINDOW_MINUTES:-15}
      SIMULPIX_TOTAL_WINDOW_MINUTES: ${SIMULPIX_TOTAL_WINDOW_MINUTES:-240}
      SIMULPIX_TIME_COMPRESSION_FACTOR: ${SIMULPIX_TIME_COMPRESSION_FACTOR:-10}
      SIMULPIX_KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      SIMULPIX_KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      SIMULPIX_KAFKA_SASL_MECHANISM: PLAIN
      SIMULPIX_KAFKA_USERNAME: simulpix
      SIMULPIX_KAFKA_PASSWORD: simulpix-secret
      SIMULPIX_TOPIC_RAW: simulpix.transactions.raw
      SIMULPIX_PIX_VALIDATOR_HEALTH_URL: http://pix-validator:8086/health
      SIMULPIX_REFERENCE_DATA: /data/reference-clients.json
      SIMULPIX_PORT: 8081
    expose:
      - "8081"
    volumes:
      - ./infra/reference:/data:ro

  pix-traffic-shaper:
    build:
      context: ./services/pix-traffic-shaper
    container_name: pix-traffic-shaper
    labels:
      simulpix.group: generation
    depends_on:
      - pix-scenario-planner
      - generator
    environment:
      SIMULPIX_SERVICE_NAME: pix-traffic-shaper
      SIMULPIX_GENERATOR_IDLE: ${SIMULPIX_GENERATOR_IDLE:-0}
      SIMULPIX_SCENARIO: ${SIMULPIX_SCENARIO:-nominal}
      SIMULPIX_RATE_PER_SECOND: ${SIMULPIX_RATE_PER_SECOND-10}
      SIMULPIX_TOTAL_MESSAGES: ${SIMULPIX_TOTAL_MESSAGES-100}
      SIMULPIX_TRAFFIC_MODEL: ${SIMULPIX_TRAFFIC_MODEL:-bursty}
      SIMULPIX_TRAFFIC_BUCKET_SECONDS: ${SIMULPIX_TRAFFIC_BUCKET_SECONDS:-1}
      SIMULPIX_TRAFFIC_TIME_COMPRESSION_FACTOR: ${SIMULPIX_TRAFFIC_TIME_COMPRESSION_FACTOR:-1}
      SIMULPIX_TRAFFIC_SECOND_AMPLITUDE: ${SIMULPIX_TRAFFIC_SECOND_AMPLITUDE:-0.18}
      SIMULPIX_TRAFFIC_MINUTE_AMPLITUDE: ${SIMULPIX_TRAFFIC_MINUTE_AMPLITUDE:-0.12}
      SIMULPIX_TRAFFIC_TEN_MINUTE_AMPLITUDE: ${SIMULPIX_TRAFFIC_TEN_MINUTE_AMPLITUDE:-0.08}
      SIMULPIX_TRAFFIC_HOUR_AMPLITUDE: ${SIMULPIX_TRAFFIC_HOUR_AMPLITUDE:-0.06}
      SIMULPIX_TRAFFIC_NOISE_AMPLITUDE: ${SIMULPIX_TRAFFIC_NOISE_AMPLITUDE:-0.08}
      SIMULPIX_TRAFFIC_BURST_PROBABILITY: ${SIMULPIX_TRAFFIC_BURST_PROBABILITY:-0.08}
      SIMULPIX_TRAFFIC_BURST_AMPLITUDE: ${SIMULPIX_TRAFFIC_BURST_AMPLITUDE:-1.8}
      SIMULPIX_TRAFFIC_BURST_DURATION_SECONDS: ${SIMULPIX_TRAFFIC_BURST_DURATION_SECONDS:-6}
      SIMULPIX_TRAFFIC_LULL_PROBABILITY: ${SIMULPIX_TRAFFIC_LULL_PROBABILITY:-0.05}
      SIMULPIX_TRAFFIC_LULL_AMPLITUDE: ${SIMULPIX_TRAFFIC_LULL_AMPLITUDE:-0.6}
      SIMULPIX_TRAFFIC_LULL_DURATION_SECONDS: ${SIMULPIX_TRAFFIC_LULL_DURATION_SECONDS:-10}
      SIMULPIX_TRAFFIC_SECOND_PERIOD_SECONDS: ${SIMULPIX_TRAFFIC_SECOND_PERIOD_SECONDS:-7}
      SIMULPIX_TRAFFIC_MINUTE_PERIOD_SECONDS: ${SIMULPIX_TRAFFIC_MINUTE_PERIOD_SECONDS:-75}
      SIMULPIX_TRAFFIC_TEN_MINUTE_PERIOD_SECONDS: ${SIMULPIX_TRAFFIC_TEN_MINUTE_PERIOD_SECONDS:-720}
      SIMULPIX_TRAFFIC_HOUR_PERIOD_SECONDS: ${SIMULPIX_TRAFFIC_HOUR_PERIOD_SECONDS:-3600}
      SIMULPIX_OPEN_LOOP_BATCH_SIZE: ${SIMULPIX_OPEN_LOOP_BATCH_SIZE:-500}
      SIMULPIX_OPEN_LOOP_PAUSE_SECONDS: ${SIMULPIX_OPEN_LOOP_PAUSE_SECONDS:-0.01}
      SIMULPIX_SEED: ${SIMULPIX_SEED:-42}
      SIMULPIX_MATCH_COUNT: ${SIMULPIX_MATCH_COUNT:-10}
      SIMULPIX_STADIUM_CAPACITY: ${SIMULPIX_STADIUM_CAPACITY:-44000}
      SIMULPIX_PIX_USAGE_RATE: ${SIMULPIX_PIX_USAGE_RATE:-0.05}
      SIMULPIX_PEAK_SHARE: ${SIMULPIX_PEAK_SHARE:-0.30}
      SIMULPIX_PEAK_WINDOW_MINUTES: ${SIMULPIX_PEAK_WINDOW_MINUTES:-15}
      SIMULPIX_TOTAL_WINDOW_MINUTES: ${SIMULPIX_TOTAL_WINDOW_MINUTES:-240}
      SIMULPIX_TIME_COMPRESSION_FACTOR: ${SIMULPIX_TIME_COMPRESSION_FACTOR:-10}
      SIMULPIX_SCENARIO_PLANNER_HEALTH_URL: http://pix-scenario-planner:8090/health
      SIMULPIX_SCENARIO_PLANNER_PLAN_URL: http://pix-scenario-planner:8090/plan
      SIMULPIX_GENERATOR_HEALTH_URL: http://generator:8081/health
      SIMULPIX_GENERATOR_EMIT_URL: http://generator:8081/emit-batch
      SIMULPIX_PORT: 8089
    expose:
      - "8089"

  pix-scenario-planner:
    build:
      context: ./services/pix-scenario-planner
    container_name: pix-scenario-planner
    labels:
      simulpix.group: generation
    environment:
      SIMULPIX_SERVICE_NAME: pix-scenario-planner
      SIMULPIX_GENERATOR_IDLE: ${SIMULPIX_GENERATOR_IDLE:-0}
      SIMULPIX_SCENARIO: ${SIMULPIX_SCENARIO:-nominal}
      SIMULPIX_RATE_PER_SECOND: ${SIMULPIX_RATE_PER_SECOND-10}
      SIMULPIX_TOTAL_MESSAGES: ${SIMULPIX_TOTAL_MESSAGES-100}
      SIMULPIX_MATCH_COUNT: ${SIMULPIX_MATCH_COUNT:-10}
      SIMULPIX_STADIUM_CAPACITY: ${SIMULPIX_STADIUM_CAPACITY:-44000}
      SIMULPIX_PIX_USAGE_RATE: ${SIMULPIX_PIX_USAGE_RATE:-0.05}
      SIMULPIX_PEAK_SHARE: ${SIMULPIX_PEAK_SHARE:-0.30}
      SIMULPIX_PEAK_WINDOW_MINUTES: ${SIMULPIX_PEAK_WINDOW_MINUTES:-15}
      SIMULPIX_TOTAL_WINDOW_MINUTES: ${SIMULPIX_TOTAL_WINDOW_MINUTES:-240}
      SIMULPIX_TIME_COMPRESSION_FACTOR: ${SIMULPIX_TIME_COMPRESSION_FACTOR:-10}
      SIMULPIX_PORT: 8090
    expose:
      - "8090"

  pix-validator:
    build:
      context: ./services/pix-validator
    container_name: pix-validator
    labels:
      simulpix.group: traitement
    cap_add:
      - NET_ADMIN
    env_file:
      # Facultatif : créé par start.sh, supprimé par stop.sh. Sans fichier,
      # `docker compose ps/stop/down` doivent quand même fonctionner.
      - path: ./runtime/current-run.env
        required: false
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    environment:
      SIMULPIX_SERVICE_NAME: pix-validator
      SIMULPIX_PROCESSING_ARCH: ${SIMULPIX_PROCESSING_ARCH:-split}
