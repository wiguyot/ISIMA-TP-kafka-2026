      SIMULPIX_POSTGRES_HOST: postgres
      SIMULPIX_POSTGRES_PORT: 5432
      SIMULPIX_DATABASE_URL: postgresql://simulpix:simulpix@postgres:5432/simulpix
      SIMULPIX_GENERATOR_URL: http://generator:8081/health
      SIMULPIX_PIX_SCENARIO_PLANNER_URL: http://pix-scenario-planner:8090/health
      SIMULPIX_PIX_TRAFFIC_SHAPER_URL: http://pix-traffic-shaper:8089/health
      SIMULPIX_PIX_VALIDATOR_URL: http://pix-validator:8086/health
      SIMULPIX_PIX_DECISION_ENGINE_URL: http://pix-decision-engine:8087/health
      SIMULPIX_PIX_OUTCOME_PUBLISHER_URL: http://pix-outcome-publisher:8088/health
      SIMULPIX_PERSISTER_VALID_URL: http://persister-valid:8084/health
      SIMULPIX_PERSISTER_REJECTED_URL: http://persister-rejected:8085/health
      SIMULPIX_INFLUXDB_HEALTH_URL: http://influxdb:8086/health
      SIMULPIX_GRAFANA_HEALTH_URL: http://grafana:3000/api/health
      SIMULPIX_GRAFANA_PUBLIC_URL: http://localhost:3000
      SIMULPIX_OBSERVABILITY_REPLICATION_FILE: /runtime/observability/latest-replication.json
      SIMULPIX_NETWORK_STATE_PATH: /runtime/current-network.json
      SIMULPIX_WARNING_LAG_TOTAL: 1
      SIMULPIX_WARNING_REJECT_RATE_PERCENT: 30
      SIMULPIX_WARNING_REJECT_MIN_PROCESSED: 10
      SIMULPIX_WARNING_PERSISTENCE_GAP: 1
      # Le conteneur pilote Docker via le socket monté ci-dessous : quand il
      # redemande au démon de (re)créer d'autres services (kafka, postgres,
      # generator...) via `docker compose`, les chemins doivent être valides
      # sur le VRAI système de fichiers hôte, pas des chemins internes au
      # conteneur. ${PWD} est résolu par Compose au moment de l'invocation
      # depuis le host (start.sh se place déjà dans le bon répertoire), donc
      # ce chemin est toujours le vrai chemin absolu du dépôt sur la machine
      # courante, quel que soit son emplacement.
      SIMULPIX_WORKSPACE_DIR: ${PWD}
      COMPOSE_PROJECT_NAME: simulpix
      SIMULPIX_PROCESSING_ARCH: ${SIMULPIX_PROCESSING_ARCH:-split}
    ports:
      - "8082:8082"
      - "8083:8083"
    volumes:
      - ./runtime:/runtime:ro
      - ${PWD}:${PWD}
      - /var/run/docker.sock:/var/run/docker.sock

  # TP 04 — ksqlDB. Service facultatif, démarré seulement avec le profil
  # `ksqldb` (./scripts/ksql.sh s'en charge) pour ne pas alourdir les autres ressources pédagogiques.
  ksqldb-server:
    image: confluentinc/cp-ksqldb-server:7.9.6@sha256:8d9573347642c9405b7c10566e29bd83e0b866f13029b343bc59337903f9f14d
    container_name: ksqldb-server
    hostname: ksqldb-server
    profiles: ["ksqldb"]
    labels:
      simulpix.group: traitement
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    ports:
      - "8088:8088"
    volumes:
      - ./infra/ksqldb:/sql:ro
    environment:
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KSQL_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KSQL_SASL_MECHANISM: PLAIN
      KSQL_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="simulpix" password="simulpix-secret";
      KSQL_KSQL_SERVICE_ID: simulpix_ksql_
      KSQL_KSQL_INTERNAL_TOPIC_REPLICAS: 3
      KSQL_KSQL_SINK_REPLICAS: 3
      KSQL_KSQL_STREAMS_REPLICATION_FACTOR: 3
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_REPLICATION_FACTOR: 3
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE: "true"
      KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE: "true"
      # Garantie de traitement : at_least_once (défaut) ou exactly_once_v2.
      KSQL_KSQL_STREAMS_PROCESSING_GUARANTEE: ${SIMULPIX_KSQL_PROCESSING_GUARANTEE:-at_least_once}
      KSQL_KSQL_STREAMS_COMMIT_INTERVAL_MS: ${SIMULPIX_KSQL_COMMIT_INTERVAL_MS:-2000}
      KSQL_KSQL_STREAMS_AUTO_OFFSET_RESET: earliest
      KSQL_HEAP_OPTS: -Xms512m -Xmx1g

volumes:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  postgres_data:
  influxdb_data:
  grafana_data:
